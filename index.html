<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SEAVARO Kugelkompass</title>
<style>html,body{margin:0;min-height:100%;background:#80bdbb;color:#102d3d;font-family:Georgia,serif}main{text-align:center;max-width:580px;margin:auto;padding:12px 10px 36px}.dial{width:min(92vw,490px);height:min(92vw,490px);margin:24px auto 8px;perspective:900px;touch-action:none}.moving{width:100%;height:100%;transform-style:preserve-3d;will-change:transform}.moving svg{width:100%;height:100%;filter:drop-shadow(0 6px 7px #17394a55)}h1{font-weight:400;font-size:clamp(45px,12vw,72px);letter-spacing:2px;margin:0}h2{font-size:clamp(14px,3.7vw,22px);font-weight:400;letter-spacing:3px;margin:0 0 22px}button{font:600 16px system-ui;background:#143e50;color:white;border:0;border-radius:12px;padding:16px}p{font:14px/1.5 system-ui;max-width:430px;margin:14px auto}</style></head>
<body><main><div class="dial" id="dial"><div class="moving" id="moving"><svg viewBox="0 0 500 500" aria-label="Bewegliche Kompassrose"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6d9e9"/><stop offset=".45" stop-color="#497c97"/><stop offset="1" stop-color="#16384f"/></linearGradient></defs><circle cx="250" cy="250" r="188" fill="none" stroke="#315c75" stroke-width="22"/><circle cx="250" cy="250" r="161" fill="none" stroke="#e4f4f4" stroke-width="3" stroke-dasharray="3 7"/><circle cx="250" cy="250" r="144" fill="none" stroke="#315b72" stroke-width="10"/><g stroke="#d5eced" stroke-width="3"><path d="M250 62V83M250 417V438M62 250H83M417 250H438M117 117l16 16m234 234 16 16m0-266-16 16M133 367l-16 16"/></g><g fill="url(#metal)" stroke="#21465c" stroke-width="1"><path d="M250 58 272 232 250 250 228 232Z"/><path d="M442 250 268 272 250 250 268 228Z"/><path d="M250 442 228 268 250 250 272 268Z"/><path d="M58 250 232 228 250 250 232 272Z"/><path d="M117 117 241 230 250 250 230 241Z"/><path d="M383 117 270 241 250 250 259 230Z"/><path d="M383 383 259 270 250 250 270 259Z"/><path d="M117 383 230 259 250 250 241 270Z"/></g><g font-family="Georgia,serif" fill="#132c3b" text-anchor="middle" font-size="32"><text x="250" y="34">N</text><text x="250" y="488">S</text><text x="25" y="261">W</text><text x="476" y="261">O</text><text x="89" y="92" font-size="24">NW</text><text x="410" y="92" font-size="24">NO</text><text x="89" y="425" font-size="24">SW</text><text x="410" y="425" font-size="24">SO</text></g></svg></div></div><h1>SEAVARO</h1><h2>MARINE PARTS &amp; ENGINES</h2><button id="enable">iPhone-Bewegung aktivieren</button><p id="status">In Safari öffnen und Sensorzugriff erlauben. Die Kompassrose lässt sich auch mit dem Finger bewegen.</p></main>
<script>
const m=document.getElementById('moving'),d=document.getElementById('dial'),status=document.getElementById('status');let x=0,y=0,z=0,tx=0,ty=0,tz=0,vx=0,vy=0,vz=0,down=false,lx=0,ly=0,received=false,origin=null;function draw(){vx=(vx+(tx-x)*.05)*.85;vy=(vy+(ty-y)*.05)*.85;vz=(vz+(tz-z)*.05)*.85;x+=vx;y+=vy;z+=vz;m.style.transform='rotateX('+x+'deg) rotateY('+y+'deg) rotateZ('+z+'deg)';requestAnimationFrame(draw)}draw();d.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;d.setPointerCapture(e.pointerId)});d.addEventListener('pointermove',e=>{if(!down)return;tz+=(e.clientX-lx)*.6;tx=Math.max(-25,Math.min(25,tx-(e.clientY-ly)*.2));lx=e.clientX;ly=e.clientY});d.addEventListener('pointerup',()=>down=false);d.addEventListener('pointercancel',()=>down=false);function motion(e){if(e.beta==null||e.gamma==null)return;received=true;if(!origin)origin={a:e.alpha||0,b:e.beta,g:e.gamma};tx=Math.max(-24,Math.min(24,(e.beta-origin.b)*.7));ty=Math.max(-24,Math.min(24,(e.gamma-origin.g)*.7));if(e.alpha!=null){let delta=((e.alpha-origin.a+540)%360)-180;tz=-delta}status.textContent='Sensor aktiv. Die Kompassrose reagiert auf deine iPhone-Bewegung.'}document.getElementById('enable').onclick=async()=>{if(!isSecureContext){status.textContent='Sensorsteuerung benötigt eine HTTPS-Adresse.';return}try{if(!window.DeviceOrientationEvent){status.textContent='Kein Bewegungssensor verfügbar.';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){let result=await DeviceOrientationEvent.requestPermission();if(result!=='granted'){status.textContent='Sensorzugriff nicht erlaubt.';return}}window.addEventListener('deviceorientation',motion,true);status.textContent='Warte auf Sensordaten. Bewege das iPhone.';setTimeout(()=>{if(!received)status.textContent='Keine Sensordaten. Bitte direkt in Safari öffnen und Bewegungszugriff prüfen.'},4000)}catch(err){status.textContent='Sensorfehler: '+err.message}};
</script></body></html>
